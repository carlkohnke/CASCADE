name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9.20"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -c locks/requirements-py39-cpu.txt '.[dev,gui]'
      - run: python -m ruff check --select E9,F63,F7,F82 src tests scripts setup_env.py
      - run: pytest -q
      - run: python -m build
      - run: python -m pip install twine
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: cascade self-test
