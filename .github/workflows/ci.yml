name: CPU CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test-wheel:
    name: ${{ matrix.name }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      CASCADE_CACHE_DIR: ${{ runner.temp }}/cascade-ci/cache
      CASCADE_CONFIG_DIR: ${{ runner.temp }}/cascade-ci/config
      CASCADE_STATE_DIR: ${{ runner.temp }}/cascade-ci/state
      CASCADE_LOG_DIR: ${{ runner.temp }}/cascade-ci/logs
      CASCADE_OUTPUT_DIR: ${{ runner.temp }}/cascade-ci/output
      MPLCONFIGDIR: ${{ runner.temp }}/cascade-ci/matplotlib
      NUMBA_CACHE_DIR: ${{ runner.temp }}/cascade-ci/numba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -c "import glob, subprocess, sys; files=glob.glob('dist/*'); assert files, files; subprocess.check_call([sys.executable, '-m', 'twine', 'check', *files])"
      - name: Install the wheel and declared test dependencies
        run: >-
          python -c "import glob, subprocess, sys;
          wheels=glob.glob('dist/*.whl');
          assert len(wheels)==1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          wheels[0] + '[dev,gui]'])"
      - name: Verify installed-wheel isolation
        run: >-
          python -c "import cascade, pathlib, sys;
          package=pathlib.Path(cascade.__file__).resolve();
          prefix=pathlib.Path(sys.prefix).resolve();
          assert package.is_relative_to(prefix), (package, prefix);
          assert 'site-packages' in str(package).lower(), package;
          print(package)"
      - name: Static checks
        run: >-
          python -m ruff check --select
          E9,F63,F7,F82,F601,F811,E741 src setup_linux.py tests
      - name: Installed-wheel test suite
        run: python -m pytest -q
      - name: Installed-wheel smoke checks
        run: |
          cascade --version
          cascade doctor --no-gpu-probe
          cascade self-test --output "${{ runner.temp }}/cascade-ci/self-test"
      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: cascade-distributions-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
