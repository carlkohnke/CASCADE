[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-vascular"
version = "0.1.0rc3"
description = "CASCADE vascular growth, simulation, and tissue oxygen workflows."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.9,<3.10"
dependencies = [
    "svv==0.0.48",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pyvista>=0.43",
    "pymeshfix>=0.17",
    "vtk>=9.2",
    "numba>=0.59",
    "numexpr>=2.8",
    "tqdm>=4.66",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scikit-image>=0.22",
    "meshio>=5.3",
    "tetgen>=0.6",
    "trimesh>=4.0",
    "open3d>=0.18",
    "usearch>=2.10",
]

[project.optional-dependencies]
gpu-cu13 = [
    "cupy-cuda13x>=13",
    "nvidia-cuda-runtime==13.2.*",
    "nvidia-cufft==12.3.0.29",
    "nvidia-nvjitlink==13.2.86",
]
gpu-cu12 = ["cupy-cuda12x>=13"]
gpu-cu11 = ["cupy-cuda11x>=13"]
gui = ["PySide6>=6.6", "psutil>=5.9"]
dev = ["pytest>=8", "ruff>=0.16"]

[project.scripts]
cascade = "cascade.commands.main:main"
cascade-gui = "cascade.gui.main:main"
cascade-viewer = "cascade.gui.viewer:main"
cascade-export-heart = "cascade.workflows.heart:main"
cascade-doctor = "cascade.diagnostics.environment:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cascade*"]

[tool.setuptools.package-data]
cascade = [
    "assets/domains/*.stl",
    "assets/numerics/*.npz",
    "gui/assets/*.svg",
    "gui/native/*.cs",
    "gui/shaders/*.frag",
    "gui/shaders/*.vert",
    "runtime/cuda/*.cu",
    "runtime/cuda/*.cuh",
]
