[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gfm"
version = "0.1.0"
description = "GFM vascular growth, simulation, and export workflows built around public svv."
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "svv==0.0.48",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pyvista>=0.43",
    "pymeshfix>=0.17",
    "vtk>=9.2",
    "numba>=0.59",
    "numexpr>=2.8",
    "tqdm>=4.66",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scikit-image>=0.22",
    "meshio>=5.3",
    "tetgen>=0.6",
    "trimesh>=4.0",
    "open3d>=0.18",
    "usearch>=2.10",
]

[project.optional-dependencies]
gpu-cu13 = ["cupy-cuda13x>=13"]
gpu-cu12 = ["cupy-cuda12x>=13"]
gpu-cu11 = ["cupy-cuda11x>=13"]
gui = ["PySide6>=6.6", "psutil>=5.9"]
dev = ["pytest>=8"]

[project.scripts]
gfm = "gfm.cli:main"
gfm-gui = "gfm.gui.main:main"
gfm-viewer = "gfm.gui.viewer:main"

[tool.setuptools.packages.find]
include = ["gfm*"]
