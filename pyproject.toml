[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-vascular"
version = "0.1.0rc1"
description = "CASCADE vascular growth, simulation, and tissue oxygen workflows built around public svVascularize."
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "svv==0.0.48",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pyvista>=0.43",
    "pymeshfix>=0.17",
    "vtk>=9.2",
    "numba>=0.59",
    "numexpr>=2.8",
    "tqdm>=4.66",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scikit-image>=0.22",
    "meshio>=5.3",
    "tetgen>=0.6",
    "trimesh>=4.0",
    "open3d>=0.18",
    "usearch>=2.10",
]

[project.optional-dependencies]
gpu-cu13 = [
    "cupy-cuda13x>=13",
    "nvidia-cuda-runtime==13.2.*",
    "nvidia-cufft==12.3.0.29",
    "nvidia-nvjitlink==13.2.86",
]
gpu-cu12 = ["cupy-cuda12x>=13"]
gpu-cu11 = ["cupy-cuda11x>=13"]
gui = ["PySide6>=6.6", "psutil>=5.9"]
dev = ["pytest>=8"]

[project.scripts]
cascade = "cascade.cli:main"
cascade-gui = "cascade.gui.main:main"
cascade-viewer = "cascade.gui.viewer:main"
cascade-export-heart = "cascade.heart_export:main"
cascade-doctor = "cascade.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cascade*"]

[tool.setuptools.package-data]
cascade = ["gui/assets/*.svg", "assets/domains/*.stl"]
