name: Windows GPU release qualification

on:
  workflow_dispatch:
  workflow_call:

jobs:
  native-windows-cuda:
    # This job deliberately requires an organization-managed NVIDIA host.
    # GitHub-hosted Windows runners do not provide a CUDA device. Register a
    # runner with all four labels before using this release gate.
    runs-on: [self-hosted, Windows, X64, cascade-gpu]
    timeout-minutes: 180
    env:
      QT_QPA_PLATFORM: offscreen
      CASCADE_RUN_GPU_QUALIFICATION: "1"
      CASCADE_CACHE_DIR: ${{ github.workspace }}/.ci-gpu/cache
      CASCADE_CONFIG_DIR: ${{ github.workspace }}/.ci-gpu/config
      CASCADE_STATE_DIR: ${{ github.workspace }}/.ci-gpu/state
      CASCADE_LOG_DIR: ${{ github.workspace }}/.ci-gpu/logs
      CASCADE_OUTPUT_DIR: ${{ github.workspace }}/.ci-gpu/output
      CUPY_CACHE_DIR: ${{ github.workspace }}/.ci-gpu/cupy
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.ci-gpu/numba
      MPLCONFIGDIR: ${{ github.workspace }}/.ci-gpu/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the release candidate
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -c "import glob, subprocess, sys; files=glob.glob('dist/*'); assert files, files; subprocess.check_call([sys.executable, '-m', 'twine', 'check', *files])"
      - name: Install the wheel with CUDA 13
        run: >-
          python -c "import glob, subprocess, sys;
          wheels=glob.glob('dist/*.whl');
          assert len(wheels)==1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--only-binary=:all:', wheels[0] + '[dev,gui,gpu-cu13]'])"
      - name: Verify installed-wheel isolation
        run: >-
          python -c "import cascade, pathlib, sys;
          package=pathlib.Path(cascade.__file__).resolve();
          prefix=pathlib.Path(sys.prefix).resolve();
          assert package.is_relative_to(prefix), (package, prefix);
          assert 'site-packages' in str(package).lower(), package;
          print(package)"
      - name: Required CUDA diagnostics
        run: |
          python -m pip check
          cascade doctor --require-gpu
          cascade self-test --require-gpu --output "${{ runner.temp }}/cascade-gpu/self-test"
      - name: Full native Windows CUDA qualification
        run: python -m pytest -q
      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gpu-qualification-evidence
          path: |
            ${{ runner.temp }}/cascade-gpu/logs
            ${{ runner.temp }}/cascade-gpu/self-test
          if-no-files-found: warn
