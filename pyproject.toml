[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-vascular"
version = "0.1.0rc5"
description = "CASCADE vascular growth, simulation, and tissue oxygen workflows."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "svv==0.0.48",
    "numpy>=1.26,<3",
    "scipy>=1.12",
    "pyvista>=0.44.2",
    "pymeshfix==0.17.0",
    "vtk>=9.2",
    "numba>=0.59",
    "numexpr>=2.8",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
    "scikit-image>=0.22",
    "meshio>=5.3",
    "tetgen>=0.8",
    "trimesh>=4.0",
    "open3d>=0.18",
    "usearch>=2.10",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
gpu-cu13 = [
    "cupy-cuda13x[ctk]>=14,<15",
]
gpu-cu12 = ["cupy-cuda12x>=13"]
gpu-cu11 = ["cupy-cuda11x>=13"]
gui = ["PySide6>=6.6", "psutil>=5.9"]
dev = ["pytest>=8", "ruff>=0.16"]

[project.scripts]
cascade = "cascade.commands.main:main"
cascade-doctor = "cascade.diagnostics.environment:main"
cascade-gui-console = "cascade.gui.main:main"
cascade-viewer-console = "cascade.gui.viewer:main"

[project.gui-scripts]
cascade-gui = "cascade.gui.main:main"
cascade-viewer = "cascade.gui.viewer:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cascade*"]

[tool.setuptools.package-data]
cascade = [
    "assets/domains/*.stl",
    "assets/numerics/*.npz",
    "gui/assets/*.svg",
    "gui/native/*.cs",
    "gui/shaders/*.frag",
    "gui/shaders/*.vert",
    "accelerators/cuda/*.cu",
    "accelerators/cuda/*.cuh",
]
